# 只对公共仓库执行轻量安全门禁。正式部署与私有数据集成必须由私人仓库负责。
name: Public repo lightweight guard

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-file-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check repository boundary (tracked paths only)
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          while IFS= read -r -d '' file; do
            case "/${file,,}" in
              */.env|*/.env.*|*/private/*|*/secrets/*|*/content/drafts/*|*/content/editorial/*|*/content/release-packages/*|*/content/review-packages/*|*/db/*|*/deploy/*|*/backups/*|*/backup/*|*.pem|*.p12|*.pfx|*.sqlite|*.sqlite3|*.db|*.sql|*.key)
                echo "::error::Disallowed path for public repository: $file"
                exit 1
                ;;
            esac
          done < <(git ls-files -z)
          echo "Path boundary check passed. Content/manual review is still required before any migration."
      - name: Verify Git whitespace and conflict markers in patches
        shell: bash
        run: |
          git diff --check
          if git grep -n -I -E '^(<<<<<<< |=======|>>>>>>> )' -- ':!README.md' ; then
            echo "::error::Possible unresolved merge conflict markers"
            exit 1
          fi
