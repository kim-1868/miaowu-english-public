# Public-only offline UI validation. No repository write access, secrets, D1, or deployment.
name: Public repo lightweight guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit approved public files and JavaScript syntax
        run: npm run check
      - name: Verify safe UI behavior and file boundary
        run: npm test
      - name: Build audited 29-file public UI delivery package
        run: npm run build:public-ui
      - name: Independently verify public-only bundle and its source SHA
        run: node scripts/verify-public-ui-release.mjs dist-public-ui "$GITHUB_SHA"
      - name: Publish immutable public UI handoff artifact (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: wordletter-public-ui-${{ github.sha }}
          path: dist-public-ui/
          if-no-files-found: error
          retention-days: 14
      - name: Verify Git formatting and conflict markers
        shell: bash
        run: |
          git diff --check
          if git grep -n -I -E '^(<<<<<<< |=======|>>>>>>> )' -- ':!README.md' ; then
            echo "::error::Possible unresolved merge conflict markers"
            exit 1
          fi
