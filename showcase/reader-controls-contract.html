<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f3ec"><title>妙屋英语｜阅读工具栏公开组件验收</title>
<link rel="stylesheet" href="./reader-controls-contract.css">
<link rel="stylesheet" href="../public/v11-reader.css">
<link rel="stylesheet" href="../public/v11-responsive.css">
<script defer src="../public/reader-preferences.js"></script>
<script defer src="./reader-controls-demo.js"></script></head>
<body>
<header class="demo-head">
 <div><a href="./index.html">← 返回公共组件</a><strong>妙屋英语 · 阅读工具栏</strong><small>PUBLIC-11｜只使用合成文字，不接触正式网站</small></div>
 <button type="button" id="globalThemeToggle" aria-label="切换到夜间模式"><span class="theme-indicator">☾</span><span class="theme-label">夜间</span></button>
</header>
<main id="view-reader" class="demo-main">
 <p class="demo-note">这不是正式付费阅读器。页面仅验证从旧 app.js 拆分的字号与日夜切换展示组件。</p>
 <div id="readerLayout" class="demo-layout">
  <div class="demo-controls"><button id="toggleNight" type="button">☾ 夜间</button>
  <button id="smallerFont" type="button" aria-label="缩小字号">A−</button>
  <div class="v11-font-slider"><label for="readerFontSlider">阅读字号</label><input id="readerFontSlider" type="range" min="12" max="24" step="1" value="18"><output id="readerFontValue" for="readerFontSlider">18px</output></div>
  <button id="biggerFont" type="button" aria-label="放大字号">A＋</button></div>
  <article class="demo-paper">
    <h1 id="chapterTitle">示例第一章 · 月光邮局</h1>
    <div id="storyText"><p>路灯亮起时，她在邮局门口收到一封 <strong lang="en">letter</strong>。这是虚构的排版示例，只用于检查中英文混排与手机端舒适度。</p></div>
  </article>
 </div>
 <p class="demo-foot">此组件不保存账号、词义、章节进度，也不会提交任何网络请求。字体默认 18px，可在 12–24px 之间调整。</p>
</main></body></html>
